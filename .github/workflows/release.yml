name: release

on:
  push:
    tags:
      - "[0-9]+.[0-9]+.[0-9]*"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set env
        run: echo "RELEASE_VERSION=${GITHUB_REF#refs/*/}" >> $GITHUB_ENV

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: 3.8

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install git+https://github.com/inettgmbh/python-mkp.git@0.10

      - name: Build
        run: |
          chmod +x build/mkp_pack.py build/update_version.py
          build/update_version.py ${{ env.RELEASE_VERSION }}
          build/mkp_pack.py
  release:
    runs-on: ubuntu-latest
    needs: [build]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          tag="${{ github.ref }}"
          gh release create --draft "$tag"

      - name: Upload a Build Artifact
        uses: actions/upload-artifact@v4.6.2
        with:
          # Artifact name
          name: mkp-package
          # A file, directory or wildcard pattern that describes what to upload
          path: "*.mkp"
          # The desired behavior if no files are found using the provided path.
          
      - name: Upload Release Asset
        id: upload-release-asset
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: proxmox_bs-${{ env.RELEASE_VERSION }}.mkp
          asset_name: proxmox_bs-${{ env.RELEASE_VERSION }}.mkp
          asset_content_type: application/gzip

  publish:
    runs-on: ubuntu-latest
    needs: [build, release]
    steps:
      - name: Publish Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: gh release edit "${{ github.ref }}" --draft=false
