name: release

on:
  push:
    tags:
      - "[0-9]+.[0-9]+.[0-9]*"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set env
        run: echo "RELEASE_VERSION=${GITHUB_REF#refs/*/}" >> $GITHUB_ENV

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: 3.8

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install git+https://github.com/inettgmbh/python-mkp.git@0.10

      - name: Build
        run: |
          chmod +x build/mkp_pack.py build/update_version.py
          build/update_version.py ${{ env.RELEASE_VERSION }}
          build/mkp_pack.py

      - name: Upload build artifact
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: gh release upload "${{ github.ref }}" "proxmox_bs-${{ env.RELEASE_VERSION }}.mkp"

  publish:
    runs-on: ubuntu-latest
    needs: [build]
    steps:
      - name: Publish Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: gh release edit "${{ github.ref }}" --draft=false
